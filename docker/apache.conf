ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Bound concurrency for Render Free's small instance. Requests keep their
# existing application permissions and Supabase bearer-token/RLS checks.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 1000
</IfModule>

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -Includes -ExecCGI +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
        LimitRequestBody 16777216
        AddType text/javascript .mjs
    </Directory>

    # Render terminates TLS and redirects public HTTP to HTTPS. Only the
    # startup script, using Render's injected RENDER=true, enables this define.
    # Client-supplied forwarding headers never control PHP's HTTPS state.
    <IfDefine MCPA_RENDER_HTTPS>
        SetEnv HTTPS on
    </IfDefine>

    Header always set X-Content-Type-Options nosniff
    ErrorLog /proc/self/fd/2
    # Omit query strings and referrers, which can contain Auth/signed-URL tokens.
    CustomLog /proc/self/fd/1 "%h %l %u %t \"%m %U %H\" %>s %b"
</VirtualHost>
